name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  library:
    name: Library (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: library
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: react
            typecheck: npx tsc --noEmit
          - example: preact
            typecheck: npx tsc --noEmit
          - example: solid
            typecheck: npx tsc --noEmit
          - example: angular
            typecheck: npx tsc --noEmit
          - example: vue
            typecheck: npx vue-tsc --noEmit
          - example: svelte
            typecheck: npx svelte-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/${{ matrix.example }}/package-lock.json
      # Examples depend on the root package via file:../.., so build dist/ first.
      - run: npm ci
      - run: npm ci
        working-directory: examples/${{ matrix.example }}
      - run: ${{ matrix.typecheck }}
        working-directory: examples/${{ matrix.example }}
      - run: npm test
        working-directory: examples/${{ matrix.example }}
